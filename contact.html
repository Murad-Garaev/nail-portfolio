<!DOCTYPE html>
<html lang="ru">
<head>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header>
    <div class="container header-flex">
        <div class="logo">Nail Studio</div>
</header>

<main>
    <section class="contacts-page">
        <div class="container">
            <h1>Свяжитесь со мной</h1>
            
            <!-- Блок с контактной информацией (подгружается из settings.json) -->
            <div id="contactsInfo" class="contacts-info">
                <!-- Сюда подтянутся телефон, email и соцсети -->
            </div>

            <!-- Дополнительный блок с адресом и графиком работы (можно добавить вручную) -->
            <div class="work-info">
                <h3>📍 Как меня найти</h3>
                <p>г. Москва, студия на ул. Цветочная, 15</p>
                <p>🚇 м. Проспект Мира, выход №3, 5 минут пешком</p>
                
                <h3>🕒 Часы работы</h3>
                <p>Понедельник – Пятница: 10:00 – 20:00</p>
                <p>Суббота: 11:00 – 18:00</p>
                <p>Воскресенье: выходной</p>
            </div>
            
            <!-- КАРТА () -->
<div class="map-container">
    <iframe src="https://yandex.ru/map-widget/v1/?um=constructor:ваш_идентификатор" width="100%" height="300" frameborder="0"></iframe>
</div>
