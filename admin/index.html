<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка | Маникюрная студия</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
    <script>
        DecapCMS.init({
            config: {
                backend: {
                    name: "github",
                    repo: "Murad-Garaev/nail-portfolio",   // ЗАМЕНИТЕ!
                    branch: "main",
                    base_url: "https://auth.decapcms.org"
                },
                local_backend: false,
                media_folder: "public/images",
                public_folder: "/images",
                collections: [
                    {
                        name: "settings",
                        label: "Настройки сайта",
                        files: [
                            {
                                file: "content/settings.json",
                                label: "Общие настройки",
                                fields: [
                                    { label: "Короткий текст 'Обо мне' (на главной)", name: "aboutShort", widget: "text" },
                                    { label: "Полный текст 'Обо мне'", name: "aboutFull", widget: "markdown" },
                                    { label: "Телефон", name: "phone", widget: "string" },
                                    { label: "Email", name: "email", widget: "string" },
                                    { label: "Социальные сети", name: "socials", widget: "object", fields: [
                                        { label: "Instagram", name: "Instagram", widget: "string" },
                                        { label: "WhatsApp", name: "WhatsApp", widget: "string" },
                                        { label: "Telegram", name: "Telegram", widget: "string" }
                                    ]}
                                ]
                            }
                        ]
                    },
                    {
                        name: "services",
                        label: "Услуги и цены",
                        folder: "content/services",
                        create: true,
                        fields: [
                            { label: "Название услуги", name: "title", widget: "string" },
                            { label: "Описание", name: "description", widget: "text", required: false },
                            { label: "Цена", name: "price", widget: "string" }
                        ]
                    },
                    {
                        name: "portfolio",
                        label: "Портфолио",
                        folder: "content/portfolio",
                        create: true,
                        fields: [
                            { label: "Название работы", name: "title", widget: "string" },
                            { label: "Описание", name: "description", widget: "text" },
                            { label: "Изображение", name: "image", widget: "image" }
                        ]
                    },
                    {
                        name: "reviews",
                        label: "Отзывы",
                        folder: "content/reviews",
                        create: true,
                        fields: [
                            { label: "Имя клиента", name: "name", widget: "string" },
                            { label: "Текст отзыва", name: "text", widget: "text" },
                            { label: "Фото (необязательно)", name: "photo", widget: "image", required: false }
                        ]
                    },
                    {
                        name: "blog",
                        label: "Блог",
                        folder: "content/blog",
                        create: true,
                        fields: [
                            { label: "Заголовок", name: "title", widget: "string" },
                            { label: "Дата", name: "date", widget: "datetime" },
                            { label: "Содержание", name: "body", widget: "markdown" },
                            { label: "Изображение", name: "image", widget: "image", required: false }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
